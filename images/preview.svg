<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">HA Native Nav Position preview</title>
  <desc id="desc">Two Home Assistant dashboard mockups showing native navigation as a floating icon dock at the top or bottom.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172635"/>
      <stop offset=".52" stop-color="#1f3d48"/>
      <stop offset="1" stop-color="#0d2139"/>
    </linearGradient>
    <linearGradient id="screenA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6bc2e8"/>
      <stop offset=".52" stop-color="#9ad0b8"/>
      <stop offset="1" stop-color="#106bd9"/>
    </linearGradient>
    <linearGradient id="screenB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#75c8e6"/>
      <stop offset=".5" stop-color="#74bfae"/>
      <stop offset="1" stop-color="#2658ca"/>
    </linearGradient>
    <linearGradient id="dock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#435a70" stop-opacity=".88"/>
      <stop offset="1" stop-color="#26394f" stop-opacity=".9"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#03101d" flood-opacity=".38"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#0b2744" flood-opacity=".22"/>
    </filter>
    <symbol id="i-home" viewBox="0 0 24 24">
      <path d="M3.5 11.2 12 4.5l8.5 6.7v8.3a1 1 0 0 1-1 1h-5.2v-5.8H9.7v5.8H4.5a1 1 0 0 1-1-1v-8.3Z" fill="currentColor"/>
    </symbol>
    <symbol id="i-shutter" viewBox="0 0 24 24">
      <path d="M5 5.5h14v3H5v-3Zm1.5 4.7h11v2.2h-11v-2.2Zm0 3.8h11v2.2h-11V14Zm0 3.8h11V20h-11v-2.2Z" fill="currentColor"/>
    </symbol>
    <symbol id="i-thermo" viewBox="0 0 24 24">
      <path d="M10 5a2 2 0 0 1 4 0v7.6a5 5 0 1 1-4 0V5Zm2 10.2a2.3 2.3 0 1 0 0 4.6 2.3 2.3 0 0 0 0-4.6Z" fill="currentColor"/>
    </symbol>
    <symbol id="i-light" viewBox="0 0 24 24">
      <path d="M9 21h6v-2H9v2Zm3-19a6 6 0 0 0-3.7 10.7c.9.7 1.2 1.3 1.4 2.3h4.6c.2-1 .5-1.6 1.4-2.3A6 6 0 0 0 12 2Z" fill="currentColor"/>
    </symbol>
    <symbol id="i-camera" viewBox="0 0 24 24">
      <path d="M4 7.5h10.2a2 2 0 0 1 2 2v.9l3.8-2.2v7.6l-3.8-2.2v.9a2 2 0 0 1-2 2H4v-9Z" fill="currentColor"/>
    </symbol>
    <symbol id="i-more" viewBox="0 0 24 24">
      <circle cx="12" cy="5" r="2.2" fill="currentColor"/>
      <circle cx="12" cy="12" r="2.2" fill="currentColor"/>
      <circle cx="12" cy="19" r="2.2" fill="currentColor"/>
    </symbol>
  </defs>

  <rect width="1400" height="788" fill="url(#page)"/>
  <circle cx="160" cy="118" r="170" fill="#2e89d7" opacity=".16"/>
  <circle cx="1260" cy="660" r="220" fill="#65d6bf" opacity=".14"/>
  <text x="700" y="84" fill="#f7fbff" font-family="Inter, Arial, Helvetica, sans-serif" font-size="52" font-weight="800" text-anchor="middle">HA Native Nav Position</text>
  <text x="700" y="130" fill="#bcd1df" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle">Navigation native Home Assistant en haut ou en bas, avec dock mobile en icones</text>

  <g transform="translate(190 174)" filter="url(#softShadow)">
    <rect width="380" height="560" rx="46" fill="#0d1a27"/>
    <rect x="14" y="14" width="352" height="532" rx="36" fill="url(#screenA)"/>
    <path d="M366 190 105 505" stroke="#0876df" stroke-width="12" opacity=".78"/>
    <rect x="14" y="14" width="352" height="532" rx="36" fill="#ffffff" opacity=".06"/>
    <text x="40" y="86" fill="#ffffff" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Dashboard</text>
    <text x="40" y="121" fill="#f0f7fb" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17">position: top</text>

    <g transform="translate(36 44)">
      <rect width="308" height="64" rx="32" fill="url(#dock)" stroke="#ffffff" stroke-opacity=".18"/>
      <g transform="translate(18 8)" color="#ffffff">
        <rect width="48" height="48" rx="24" fill="#ffffff" opacity=".16"/>
        <use href="#i-home" x="12" y="12" width="24" height="24"/>
      </g>
      <g transform="translate(75 8)" color="#cbd8e3"><use href="#i-shutter" x="12" y="12" width="24" height="24"/></g>
      <g transform="translate(132 8)" color="#cbd8e3"><use href="#i-thermo" x="12" y="12" width="24" height="24"/></g>
      <g transform="translate(189 8)" color="#cbd8e3"><use href="#i-light" x="12" y="12" width="24" height="24"/></g>
      <g transform="translate(246 8)" color="#cbd8e3"><use href="#i-more" x="12" y="12" width="24" height="24"/></g>
    </g>

    <g transform="translate(38 168)" filter="url(#cardShadow)" opacity=".78">
      <rect width="138" height="98" rx="28" fill="#d9e4ea" opacity=".62"/>
      <rect x="168" width="138" height="98" rx="28" fill="#d9e4ea" opacity=".62"/>
      <rect y="124" width="138" height="98" rx="28" fill="#d9e4ea" opacity=".62"/>
      <rect x="168" y="124" width="138" height="98" rx="28" fill="#d9e4ea" opacity=".62"/>
      <rect y="248" width="138" height="98" rx="28" fill="#d9e4ea" opacity=".62"/>
      <rect x="168" y="248" width="138" height="98" rx="28" fill="#d9e4ea" opacity=".62"/>
    </g>
  </g>

  <g transform="translate(830 174)" filter="url(#softShadow)">
    <rect width="380" height="560" rx="46" fill="#0d1a27"/>
    <rect x="14" y="14" width="352" height="532" rx="36" fill="url(#screenB)"/>
    <path d="M366 292 80 545" stroke="#0876df" stroke-width="12" opacity=".78"/>
    <rect x="14" y="14" width="352" height="532" rx="36" fill="#ffffff" opacity=".06"/>
    <text x="40" y="80" fill="#ffffff" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Dashboard</text>
    <text x="40" y="115" fill="#f0f7fb" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17">position: bottom</text>

    <g transform="translate(38 132)" filter="url(#cardShadow)" opacity=".78">
      <rect width="138" height="98" rx="28" fill="#d9e4ea" opacity=".62"/>
      <rect x="168" width="138" height="98" rx="28" fill="#d9e4ea" opacity=".62"/>
      <rect y="124" width="138" height="98" rx="28" fill="#d9e4ea" opacity=".62"/>
      <rect x="168" y="124" width="138" height="98" rx="28" fill="#d9e4ea" opacity=".62"/>
      <rect y="248" width="138" height="98" rx="28" fill="#d9e4ea" opacity=".62"/>
      <rect x="168" y="248" width="138" height="98" rx="28" fill="#d9e4ea" opacity=".62"/>
    </g>

    <g transform="translate(36 458)">
      <rect width="308" height="64" rx="32" fill="url(#dock)" stroke="#ffffff" stroke-opacity=".18"/>
      <g transform="translate(18 8)" color="#ffffff">
        <rect width="48" height="48" rx="24" fill="#ffffff" opacity=".16"/>
        <use href="#i-home" x="12" y="12" width="24" height="24"/>
      </g>
      <g transform="translate(75 8)" color="#cbd8e3"><use href="#i-shutter" x="12" y="12" width="24" height="24"/></g>
      <g transform="translate(132 8)" color="#cbd8e3"><use href="#i-thermo" x="12" y="12" width="24" height="24"/></g>
      <g transform="translate(189 8)" color="#cbd8e3"><use href="#i-light" x="12" y="12" width="24" height="24"/></g>
      <g transform="translate(246 8)" color="#cbd8e3"><use href="#i-more" x="12" y="12" width="24" height="24"/></g>
    </g>
  </g>
</svg>
